name: main

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x

      - name: Show .NET information
        run: dotnet --info

      - name: Restore dependencies
        run: dotnet restore CleanArchitectureModule.slnx

      - name: Build
        run: dotnet build CleanArchitectureModule.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test CleanArchitectureModule.slnx --configuration Release --no-build --no-restore --verbosity normal